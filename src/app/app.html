<div class="shell">
  <div class="shell-body">
    <nav class="shell-sidenav">
      <ul class="shell-sidenav__list">
        <li>
          <a routerLink="/" routerLinkActive="shell-sidenav__link--active" [routerLinkActiveOptions]="{ exact: true }" class="shell-sidenav__link">
            {{ 'nav.riskCockpit' | translate }}
          </a>
        </li>
        <li>
          <a routerLink="/overview" routerLinkActive="shell-sidenav__link--active" class="shell-sidenav__link">
            {{ 'nav.overview' | translate }}
          </a>
        </li>
        <li>
          <a routerLink="/workflows" routerLinkActive="shell-sidenav__link--active" class="shell-sidenav__link">
            {{ 'nav.workflows' | translate }}
          </a>
        </li>
        <li>
          <a routerLink="/api-examples" routerLinkActive="shell-sidenav__link--active" class="shell-sidenav__link">
            {{ 'nav.apiExamples' | translate }}
          </a>
        </li>
      </ul>
    </nav>

    <main class="shell-content">
      <header class="shell-content__header">
        <h1 class="spds-h4">Hello, {{ title() }}</h1>
        <div class="shell-content__meta">
          <p-tag [value]="'status.' + status() | translate" [severity]="handshakeSeverity[status()]" />
          @if (context(); as ctx) {
            <span class="shell-content__context">
              {{ ctx.tenant.org }} &middot; {{ ctx.user.displayName }}
            </span>
          }
        </div>
      </header>
      <div class="shell-content__card">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
